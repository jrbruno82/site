      m1: 'Milhas por ano = milhas rodadas ÷ anos de uso. Um ano-modelo começa a ser vendido no outono anterior, então cada carro é contado a partir do meio do período de venda.',
      m2: 'O histórico de valor é modelado a partir da desvalorização típica de seminovos na Califórnia em 2025–26 para cada modelo e versão (carros mais novos perdem valor mais rápido; a época de restituição de impostos, na primavera, eleva um pouco os preços). Cada linha termina no preço pedido hoje.',
      m3: 'A nota custo-benefício (0–100) pondera valor 35%, milhas por ano 25%, retenção de valor em 12 meses 20% e consumo 20%, em escala entre todos os carros listados.',
      regions: {'Central Valley': 'Vale Central', 'Northern California': 'Norte da Califórnia', 'Southern California': 'Sul da Califórnia'},
      loc: 'pt-BR', mi: 'mi'
    }
  };

  dash.calc('scores', {
    title: 'Value score and 12-month change',
    description: 'Each car\'s value 12 months ago, its % change to today, and a 0–100 value score (35% price, 25% miles per year, 20% value retention, 20% mpg) scaled across all listed cars.',
    inputs: ['vehicles', 'depreciation'],
    fn: (vehicles, depreciation) => {
      const first = {}, last = {};
      for (const d of depreciation) {
        const v = Number(d.value);
        if (!first[d.id] || d.month < first[d.id].m) first[d.id] = {m: d.month, v};
        if (!last[d.id] || d.month > last[d.id].m) last[d.id] = {m: d.month, v};
      }
      const rows = vehicles.map((v) => {
        const a = first[v.id] ? first[v.id].v : null, b = last[v.id] ? last[v.id].v : null;
        return {id: v.id, price: Number(v.price), mpy: Number(v.miles_per_year), mpg: Number(v.mpg), value_12m_ago: a, change_pct: a ? (b - a) / a : 0};
      });
      const span = (k) => [Math.min(...rows.map((r) => r[k])), Math.max(...rows.map((r) => r[k]))];
      const norm = (x, [lo, hi], lowerIsBetter) => hi === lo ? 1 : lowerIsBetter ? (hi - x) / (hi - lo) : (x - lo) / (hi - lo);
      const P = span('price'), M = span('mpy'), G = span('mpg'), C = span('change_pct');
      return rows.map((r) => ({
        id: r.id, value_12m_ago: r.value_12m_ago, change_pct: r.change_pct,
        score: Math.round(100 * (0.35 * norm(r.price, P, true) + 0.25 * norm(r.mpy, M, true) + 0.2 * norm(r.change_pct, C, false) + 0.2 * norm(r.mpg, G, false)))
      }));
    }
  });

  const root = document.querySelector('.cf');
  const MODELS = ['Civic', 'Prius', 'Camry'];
  const REGION_CITIES = {'Central Valley': ['Fresno'], 'Northern California': ['Sacramento', 'San Francisco'], 'Southern California': ['Los Angeles']};
  const DEFAULTS = () => ({region: '', city: '', car: '', models: new Set(), maxMiles: 60000, minPrice: 15000, maxPrice: 30000});
  let state = DEFAULTS();
  let lang = 'en';
  let sort = {key: 'price', dir: 1};
  const t = (k) => T[lang][k];
  const isPref = (model) => MODELS.includes(model);
  const colorOf = (model) => isPref(model) ? dash.colors[MODELS.indexOf(model)] : 'var(--cds-chart-muted)';

  const num = (x) => new Intl.NumberFormat(t('loc'), {maximumFractionDigits: 0}).format(x);
  const pct = (x) => (x > 0 ? '+' : '') + new Intl.NumberFormat(t('loc'), {style: 'percent', minimumFractionDigits: 1, maximumFractionDigits: 1}).format(x);
  const monthLab = (m) => new Date(m + 'T00:00:00Z').toLocaleDateString(t('loc'), {month: 'short', year: '2-digit', timeZone: 'UTC'});
  const measure = (svg, text, cls) => { const n = svg.append('text').attr('class', cls).attr('opacity', 0).text(text); const w = n.node().getComputedTextLength(); n.remove(); return w; };

  /* ---------- controls ---------- */
  const fRegion = $('#f-region'), fCity = $('#f-city'), fMake = $('#f-make'), fModels = $('#f-models');
  const fMiles = $('#f-miles'), fMin = $('#f-min'), fMax = $('#f-max');

    fRegion.value = state.region;
    const cities = state.region ? REGION_CITIES[state.region] : Object.values(REGION_CITIES).flat();
    if (state.city && !cities.includes(state.city)) state.city = '';
    fCity.replaceChildren(new Option(t('allCities'), ''), ...cities.map((c) => new Option(c, c)));
    fCity.value = state.city;
    fMake.replaceChildren(new Option(t('allMakes'), ''), ...cars.map((c) => new Option(c, c)));
    fMake.value = state.car;
    fModels.replaceChildren(...MODELS.map((m) => {
      const b = el('button', 'cf-chip'); b.type = 'button'; b.dataset.model = m;

  fRegion.addEventListener('change', () => { state.region = fRegion.value; render(); });
  fCity.addEventListener('change', () => { state.city = fCity.value; render(); });
  fMake.addEventListener('change', () => { state.car = fMake.value; render(); });
  // Preferred-car chips are their own filter: none picked shows every car, picking narrows to those models.
  fModels.addEventListener('click', (e) => {

  /* ---------- tooltip helper ---------- */
  function tipFor(box) {
    let tip = box.querySelector('.cf-tip');
    if (!tip) { tip = el('div', 'cf-tip'); tip.hidden = true; box.append(tip); }
    return {
      show(x, y, lines) {
        tip.replaceChildren(...lines.map((l, i) => { const d = el('div', i === 0 ? 'cf-tipk' : '', l.text); if (l.color) { const s = el('span', 'cf-dot'); s.style.background = l.color; d.prepend(s); } return d; }));
        tip.hidden = false;
        const bw = box.clientWidth, tw = tip.offsetWidth, th = tip.offsetHeight;
        tip.style.left = Math.max(0, Math.min(bw - tw, x + 12)) + 'px';
        tip.style.top = Math.max(0, y - th - 10) + 'px';
      },
      hide() { tip.hidden = true; }
    };
  }

  /* ---------- charts ---------- */
  function drawScatter(rows) {
    const box = $('#chart-scatter'); box.querySelector('svg')?.remove();

    const yFmt = (v) => '$' + (v / 1000) + 'k';
    const ml = measure(svg, '$30k', 'cf-tick') + 10, m = {t: 10, r: 14, b: 26, l: ml};
    const x = d3.scaleLinear([0, 60000], [m.l, W - m.r]);
    const y = d3.scaleLinear([15000, 30000], [H - m.b, m.t]);
    const g = svg.append('g');
    g.selectAll('line.gy').data(y.ticks(4)).join('line').attr('x1', m.l).attr('x2', W - m.r).attr('y1', y).attr('y2', y).attr('stroke', 'var(--cds-chart-grid)');
    g.selectAll('text.ty').data(y.ticks(4)).join('text').attr('class', 'cf-tick').attr('x', m.l - 8).attr('y', (d) => y(d) + 4).attr('text-anchor', 'end').text(yFmt);
    const xt = W < 380 ? [0, 30000, 60000] : [0, 20000, 40000, 60000];
    g.selectAll('text.tx').data(xt).join('text').attr('class', 'cf-tick').attr('x', x).attr('y', H - 6).attr('text-anchor', (d, i) => i === 0 ? 'start' : i === xt.length - 1 ? 'end' : 'middle').text((d) => num(d / 1000) + 'k ' + t('mi'));
    g.append('line').attr('x1', m.l).attr('x2', W - m.r).attr('y1', H - m.b).attr('y2', H - m.b).attr('stroke', 'var(--cds-chart-axis)');
    const tip = tipFor(box);
    const layered = [...rows].sort((a, b) => isPref(a.model) - isPref(b.model));
    svg.append('g').selectAll('circle').data(layered).join('circle')
      .attr('cx', (d) => x(d.miles)).attr('cy', (d) => y(d.price)).attr('r', 6)
      .attr('fill', (d) => colorOf(d.model)).attr('fill-opacity', .85).attr('stroke', 'var(--color-panel)').attr('stroke-width', 1.5)
      .style('cursor', 'pointer')
      .on('mouseenter', function (e, d) { d3.select(this).attr('r', 8); tip.show(x(d.miles), y(d.price), [{text: d.dealer}, {text: `${d.vehicle} ${d.trim} ${d.model_year}`, color: colorOf(d.model)}, {text: `${money(d.price)} · ${num(d.miles)} ${t('mi')}`}]); })
      .on('mouseleave', function () { d3.select(this).attr('r', 6); tip.hide(); })
      .on('click', (e, d) => goTo(d.id));
    const lg = $('#legend-models');
    const keys = MODELS.filter((mm) => rows.some((r) => r.model === mm)).map((mm) => [mm, colorOf(mm)]);
    if (rows.some((r) => !isPref(r.model))) keys.push([t('others'), 'var(--cds-chart-muted)']);
    lg.replaceChildren(...keys.map(([label, color]) => { const s = el('span'); const i = el('i'); i.style.background = color; s.append(i, document.createTextNode(label)); return s; }));

  function drawCity(rows) {
    const box = $('#chart-city'); box.querySelector('svg')?.remove();
    const cities = ['Fresno', 'Sacramento', 'San Francisco', 'Los Angeles'];
    const data = cities.map((c) => { const r = rows.filter((v) => v.city === c); return {city: c, n: r.length, avg: r.length ? d3.mean(r, (v) => v.price) : null}; }).filter((d) => d.n);
    const W = Math.max(280, box.clientWidth), H = 240;
    const svg = d3.select(box).insert('svg', ':first-child').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`);
    const ml = Math.max(...cities.map((c) => measure(svg, c, 'cf-tick'))) + 12;
    const mr = measure(svg, money(30000), 'cf-endlab') + 10;
    const y = d3.scaleBand(data.map((d) => d.city), [8, H - 8]).padding(.38);
    const x = d3.scaleLinear([0, 30000], [ml, W - mr]);
    svg.selectAll('rect').data(data).join('rect').attr('x', ml).attr('y', (d) => y(d.city)).attr('height', Math.min(32, y.bandwidth())).attr('width', (d) => x(d.avg) - ml).attr('rx', 4).attr('fill', dash.colors[0]);
    svg.selectAll('text.c').data(data).join('text').attr('class', 'cf-tick').attr('x', ml - 8).attr('y', (d) => y(d.city) + Math.min(32, y.bandwidth()) / 2 + 4).attr('text-anchor', 'end').text((d) => d.city);
    svg.selectAll('text.v').data(data).join('text').attr('class', 'cf-endlab').attr('fill', 'var(--color-fg)').attr('x', (d) => x(d.avg) + 6).attr('y', (d) => y(d.city) + Math.min(32, y.bandwidth()) / 2 + 4).text((d) => money(d.avg));
  }

  function drawIndex(rows, depBy) {
    const box = $('#chart-index'); box.querySelector('svg')?.remove();
    const months = (depBy.get(rows[0].id) || []).map((d) => d.month);
    const groups = MODELS.filter((mm) => rows.some((r) => r.model === mm)).map((mm) => ({label: mm, color: colorOf(mm), cars: rows.filter((r) => r.model === mm)}));
    const other = rows.filter((r) => !isPref(r.model));
    if (other.length) groups.push({label: t('others'), color: 'var(--cds-chart-muted)', cars: other});
    const series = groups.map((gp) => {
      const cars = gp.cars.map((r) => depBy.get(r.id)).filter(Boolean);
      return {label: gp.label, color: gp.color, pts: months.map((mo, i) => ({month: mo, v: d3.mean(cars, (c) => 100 * c[i].value / c[0].value)}))};
    });
    const W = Math.max(280, box.clientWidth), H = 240;
    const svg = d3.select(box).insert('svg', ':first-child').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`);
    const lo = Math.floor(d3.min(series, (s) => d3.min(s.pts, (p) => p.v)) - 1), hi = 101;
    const ml = measure(svg, '100', 'cf-tick') + 10;
    const mr = Math.max(...series.map((s) => measure(svg, `${s.label} ${s.pts[11].v.toFixed(1)}`, 'cf-endlab'))) + 12;
    const x = d3.scalePoint(months, [ml, W - mr]);
    const y = d3.scaleLinear([lo, hi], [H - 26, 10]);
    const ticks = y.ticks(4);
    svg.selectAll('line.g').data(ticks).join('line').attr('x1', ml).attr('x2', W - mr).attr('y1', y).attr('y2', y).attr('stroke', (d) => d === 100 ? 'var(--cds-chart-reference)' : 'var(--cds-chart-grid)');
    svg.selectAll('text.ty').data(ticks).join('text').attr('class', 'cf-tick').attr('x', ml - 8).attr('y', (d) => y(d) + 4).attr('text-anchor', 'end').text((d) => d);
    const xt = [months[0], months[6], months[11]];
    svg.selectAll('text.tx').data(xt).join('text').attr('class', 'cf-tick').attr('x', x).attr('y', H - 6).attr('text-anchor', (d, i) => ['start', 'middle', 'end'][i]).text(monthLab);
    const line = d3.line().x((p) => x(p.month)).y((p) => y(p.v));
    svg.selectAll('path.s').data(series).join('path').attr('d', (s) => line(s.pts)).attr('fill', 'none').attr('stroke', (s) => s.color).attr('stroke-width', 2).attr('stroke-linecap', 'round').attr('stroke-linejoin', 'round');
    const ends = series.map((s) => ({s, y: y(s.pts[11].v)})).sort((a, b) => a.y - b.y);
    for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
    svg.selectAll('circle.e').data(series).join('circle').attr('cx', x(months[11])).attr('cy', (s) => y(s.pts[11].v)).attr('r', 3.5).attr('fill', (s) => s.color);
    svg.selectAll('text.e').data(ends).join('text').attr('class', 'cf-endlab').attr('x', x(months[11]) + 8).attr('y', (e) => e.y + 4).attr('fill', 'var(--color-fg)').text((e) => `${e.s.label} ${e.s.pts[11].v.toFixed(1)}`);
    const tip = tipFor(box);
    const rule = svg.append('line').attr('y1', 10).attr('y2', H - 26).attr('stroke', 'var(--cds-chart-axis)').attr('opacity', 0);
    svg.append('rect').attr('x', ml).attr('y', 0).attr('width', W - mr - ml).attr('height', H).attr('fill', 'transparent')
      .on('mousemove', (e) => {
        const [px] = d3.pointer(e); const step = x.step(); const i = Math.max(0, Math.min(11, Math.round((px - ml) / step)));
        rule.attr('x1', x(months[i])).attr('x2', x(months[i])).attr('opacity', 1);
        tip.show(x(months[i]), 40, [{text: monthLab(months[i])}, ...series.map((s) => ({text: `${s.label} ${s.pts[i].v.toFixed(1)}`, color: s.color}))]);
      })
      .on('mouseleave', () => { rule.attr('opacity', 0); tip.hide(); });
  }

  function drawMini(box, v, pts) {
    box.querySelector('svg')?.remove();
    const W = Math.max(260, box.clientWidth), H = 150;
    const svg = d3.select(box).insert('svg', ':first-child').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`);
    const lo = d3.min(pts, (p) => p.value), hi = d3.max(pts, (p) => p.value);
    const pad = Math.max(300, (hi - lo) * .15);
    const y = d3.scaleLinear([lo - pad, hi + pad], [H - 24, 8]).nice(3);
    const ticks = y.ticks(3);
    const yf = (d) => '$' + num(d / 1000) + 'k';
    const ml = Math.max(...ticks.map((d) => measure(svg, yf(d), 'cf-tick'))) + 8;
    const x = d3.scalePoint(pts.map((p) => p.month), [ml, W - 10]);
    const id = 'g-' + v.id;
    const grad = svg.append('defs').append('linearGradient').attr('id', id).attr('x1', 0).attr('x2', 0).attr('y1', 0).attr('y2', 1);
    [[0, .26], [.25, .16], [.5, .08], [.75, .03], [1, 0]].forEach(([o, a]) => grad.append('stop').attr('offset', o).attr('style', `stop-color:${colorOf(v.model)};stop-opacity:${a}`));
    svg.selectAll('line.g').data(ticks).join('line').attr('x1', ml).attr('x2', W - 10).attr('y1', y).attr('y2', y).attr('stroke', 'var(--cds-chart-grid)');
    svg.selectAll('text.ty').data(ticks).join('text').attr('class', 'cf-tick').attr('x', ml - 6).attr('y', (d) => y(d) + 4).attr('text-anchor', 'end').text(yf);
    const xt = [pts[0].month, pts[11].month];
    svg.selectAll('text.tx').data(xt).join('text').attr('class', 'cf-tick').attr('x', x).attr('y', H - 6).attr('text-anchor', (d, i) => i ? 'end' : 'start').text(monthLab);
    svg.append('path').attr('d', d3.area().x((p) => x(p.month)).y0(H - 24).y1((p) => y(p.value))(pts)).attr('fill', `url(#${id})`);
    svg.append('path').attr('d', d3.line().x((p) => x(p.month)).y((p) => y(p.value))(pts)).attr('fill', 'none').attr('stroke', colorOf(v.model)).attr('stroke-width', 2).attr('stroke-linecap', 'round').attr('stroke-linejoin', 'round');
    svg.append('circle').attr('cx', x(pts[11].month)).attr('cy', y(pts[11].value)).attr('r', 3.5).attr('fill', colorOf(v.model));
    const dot = svg.append('circle').attr('r', 4).attr('fill', colorOf(v.model)).attr('stroke', 'var(--color-panel)').attr('stroke-width', 1.5).attr('opacity', 0);
    const tip = tipFor(box);
    svg.append('rect').attr('x', ml).attr('y', 0).attr('width', W - 10 - ml).attr('height', H).attr('fill', 'transparent')
      .on('mousemove', (e) => {
        const [px] = d3.pointer(e); const i = Math.max(0, Math.min(11, Math.round((px - ml) / x.step())));
        const p = pts[i]; dot.attr('cx', x(p.month)).attr('cy', y(p.value)).attr('opacity', 1);
        tip.show(x(p.month), y(p.value), [{text: monthLab(p.month)}, {text: money(p.value)}]);
      })
      .on('mouseleave', () => { dot.attr('opacity', 0); tip.hide(); });
  }

  /* ---------- table ---------- */
  const COLS = () => [
    {key: 'dealer', label: t('cDealer')}, {key: 'vehicle', label: t('cVehicle')}, {key: 'trim', label: t('cTrim')},
    {key: 'price', label: t('cPrice'), num: true, fmt: money}, {key: 'year', label: t('cYear')},
    {key: 'miles', label: t('cMiles'), num: true, fmt: num}, {key: 'miles_per_year', label: t('cMpy'), num: true, fmt: num},
    {key: 'options_' + lang, label: t('cOpts'), cls: 'cf-opts'}, {key: 'link', label: t('cLink'), link: true}
  ];
  function drawTable(rows) {
    const cols = COLS();
    $('#thead-cars').replaceChildren(...cols.map((c) => {
      const th = el('th', c.num ? 'cf-num' : ''); th.dataset.field = c.key;
      if (c.link) { th.append(el('span', 'cf-plain', c.label)); return th; }
      const b = el('button', '', c.label + (sort.key === c.key ? (sort.dir > 0 ? ' ↑' : ' ↓') : '')); b.type = 'button';
      th.setAttribute('aria-sort', sort.key === c.key ? (sort.dir > 0 ? 'ascending' : 'descending') : 'none');
      b.addEventListener('click', () => { sort = {key: c.key, dir: sort.key === c.key ? -sort.dir : (c.num ? 1 : 1)}; render(); });
      th.append(b); return th;
    }));
    const sorted = [...rows].sort((a, b) => {
      const k = sort.key, av = a[k], bv = b[k];
      return (typeof av === 'number' ? av - bv : String(av).localeCompare(String(bv))) * sort.dir;
    });
    $('#tbody-cars').replaceChildren(...sorted.map((v) => {
      const tr = el('tr'); tr.dataset.key = v.id;
      cols.forEach((c, i) => {
        const td = el('td', [c.num ? 'cf-num' : '', c.cls || ''].join(' ').trim());
        if (c.link) { const a = el('a', '', t('linkText')); a.href = v.link; a.target = '_blank'; a.rel = 'noopener'; td.append(a); }
        else if (i === 1) {
          const s = el('span', 'cf-dot'); s.style.background = colorOf(v.model); td.append(s, document.createTextNode(v.vehicle));
          if (isPref(v.model)) { const star = el('span', 'cf-star'); star.title = t('prefBadge'); td.append(star); }
        }
        else td.textContent = c.fmt ? c.fmt(v[c.key]) : v[c.key];
        tr.append(td);
      });
      return tr;
    }));
  }

  function drawDealers(dealers) {
    const cols = [['dealer', t('dDealer')], ['city', t('dCity')], ['rating', t('dRating')], ['basis_' + lang, t('dBasis')], ['source', t('dSource')]];
    $('#thead-dealers').replaceChildren(...cols.map(([k, l]) => { const th = el('th'); th.dataset.field = k; th.append(el('span', 'cf-plain', l)); return th; }));
    $('#tbody-dealers').replaceChildren(...dealers.map((d) => {
      const tr = el('tr'); tr.dataset.key = d.dealer;
      cols.forEach(([k]) => {
        const td = el('td');
        if (k === 'source') { const a = el('a', '', d.source); a.href = d.source_url; a.target = '_blank'; a.rel = 'noopener'; td.append(a); }
        else td.textContent = d[k];
        tr.append(td);
      });
      return tr;
    }));
  }

  /* ---------- main render ---------- */
  const failBox = (sel) => { const b = $(sel); b.replaceChildren(el('div', 'cf-fail', 'Failed to load')); };

  function render() {
    const V = dash.data('vehicles'), D = dash.data('depreciation'), S = dash.data('scores'), DL = dash.data('dealers');
    drawControls(V.status === 'ok' ? [...new Set(V.data.map((v) => v.vehicle))].sort() : []);
    if (DL.status === 'ok') drawDealers(DL.data); else if (DL.status === 'error') failBox('#tbody-dealers');
    const parts = ['#kpis', '#picks', '#chart-scatter', '#chart-city', '#chart-index', '#cars'];
    if ([V, D, S].some((x) => x.status === 'error')) { parts.forEach(failBox); $('#takeaway').textContent = '—'; return; }
    if (![V, D, S].every((x) => x.status === 'ok')) { parts.forEach((p) => $(p).classList.add('dash-skeleton')); return; }
    parts.forEach((p) => $(p).classList.remove('dash-skeleton'));

    const all = V.data.map((v) => ({...v, price: Number(v.price), miles: Number(v.miles), miles_per_year: Number(v.miles_per_year), mpg: Number(v.mpg), model_year: Number(v.model_year)}));
    const scoreBy = new Map(S.data.map((s) => [s.id, s]));
    const depBy = d3.group(D.data.map((d) => ({id: d.id, month: String(d.month).slice(0, 10), value: Number(d.value)})).sort((a, b) => a.month < b.month ? -1 : 1), (d) => d.id);
    const rows = all.filter((v) =>
      (!state.region || v.region === state.region) && (!state.city || v.city === state.city) &&
      (!state.car || v.vehicle === state.car) && (!state.models.size || state.models.has(v.model)) &&
      v.miles <= state.maxMiles && v.price >= state.minPrice && v.price <= state.maxPrice
    ).map((v) => ({...v, ...scoreBy.get(v.id)}));

    if (!rows.length) {
      $('#takeaway').textContent = t('take0');
      $('#kpis').replaceChildren(el('div', 'cf-empty', t('empty')));
      ['#picks', '#cars'].forEach((s) => $(s).replaceChildren());
      ['#chart-scatter', '#chart-city', '#chart-index'].forEach((s) => { $(s).replaceChildren(el('div', 'cf-empty', t('empty'))); });
      $('#legend-models').replaceChildren();
      $('#tbody-cars').replaceChildren();
      return;
    }
    ['#chart-scatter', '#chart-city', '#chart-index'].forEach((s) => $(s).querySelector('.cf-empty')?.remove());

    const best = [...rows].sort((a, b) => b.score - a.score)[0];
    const prefRows = rows.filter((r) => isPref(r.model));
    $('#takeaway').textContent = t('take')(rows.length, prefRows.length, `${best.vehicle} ${best.trim} ${best.model_year}`, best.dealer, money(best.price));

    const kp = [
      [t('kMatches'), num(rows.length)], [t('kPref'), num(prefRows.length)], [t('kLow'), money(d3.min(rows, (r) => r.price))], [t('kAvg'), money(d3.mean(rows, (r) => r.price))],
      [t('kMiles'), num(d3.mean(rows, (r) => r.miles))], [t('kMpy'), num(d3.mean(rows, (r) => r.miles_per_year))], [t('kChg'), pct(d3.mean(rows, (r) => r.change_pct))]
    ];
    $('#kpis').replaceChildren(...kp.map(([l, v]) => { const d = el('div', 'cf-kpi'); d.append(el('span', 'cf-sub', l), el('b', '', v)); return d; }));

    const by = (f, dir) => [...rows].sort((a, b) => dir * (f(a) - f(b)) || a.price - b.price)[0];
    const budget = by((r) => r.price, 1), eco = by((r) => r.mpg, -1), keeper = by((r) => r.change_pct, -1);
    const picks = [[t('pBest'), best, t('wBest')(best.score)]];
    // Only worth its own card when the list also holds other makes; otherwise it repeats "Best overall".
    if (prefRows.length && prefRows.length < rows.length) {
      const bp = [...prefRows].sort((a, b) => b.score - a.score)[0];
      picks.push([t('pPref'), bp, t('wBest')(bp.score)]);
    }
    picks.push(
      [t('pBudget'), budget, t('wBudget')(num(budget.miles) + ' ' + t('mi'))],
      [t('pMpg'), eco, t('wMpg')(eco.mpg)],
      [t('pRet'), keeper, t('wRet')(pct(keeper.change_pct))]
    );
    $('#picks').replaceChildren(...picks.map(([label, v, why]) => {
      const c = el('article', 'cf-card cf-pick');
      const b = el('button', 'cf-btn', t('details')); b.type = 'button'; b.dataset.goto = v.id;
      c.append(el('span', 'cf-eyebrow', label), el('span', 'cf-name', `${v.vehicle} ${v.trim} ${v.model_year}`), el('span', 'cf-sub', `${v.dealer} · ${v.city}`), el('span', 'cf-price', money(v.price)), el('span', 'cf-why', why), b);
      return c;
    }));

    drawScatter(rows);
    drawCity(rows);
    drawIndex(rows, depBy);
    drawTable(rows);

    const ordered = [...rows].sort((a, b) => b.score - a.score);
    $('#cars').replaceChildren(...ordered.map((v) => {
      const c = el('article', 'cf-card cf-car'); c.id = 'car-' + v.id;
      const top = el('div', 'cf-cartop');
      const left = el('div');
      left.append(el('div', 'cf-carname', `${v.vehicle} ${v.trim}`), el('div', 'cf-sub', `${v.year} · ${v.dealer} · ${v.city}`));
      top.append(left, el('div', 'cf-price', money(v.price)));
      const stats = el('div', 'cf-stats');
      if (isPref(v.model)) stats.append(el('span', 'cf-stat cf-prefb', t('prefBadge')));
      [`${num(v.miles)} ${t('mi')}`, `${num(v.miles_per_year)} ${t('perYr')}`, `${v.mpg} mpg`, `${t('score')} ${v.score}`].forEach((s) => stats.append(el('span', 'cf-stat', s)));
      const pc = el('div', 'cf-pc');
      const mk = (cls, title, txt) => { const d = el('div', cls); const ul = el('ul'); String(txt).split('|').forEach((x) => ul.append(el('li', '', x))); d.append(el('h3', '', title), ul); return d; };
      pc.append(mk('cf-pros', t('pros'), v['pros_' + lang]), mk('cf-cons', t('cons'), v['cons_' + lang]));
      const deprow = el('div', 'cf-deprow');
      const chg = el('span', 'cf-chg', `${money(v.value_12m_ago)} → ${money(v.price)} (${pct(v.change_pct)})`);
      chg.style.color = 'var(--color-bad)';
      deprow.append(el('h3', '', t('dep')), chg);
      const mini = el('div', 'cf-mini');
      const foot = el('div', 'cf-cardfoot');
      const a = el('a', '', t('linkText')); a.href = v.link; a.target = '_blank'; a.rel = 'noopener';
      foot.append(el('span', '', v.dealer_rating), a);
      c.append(top, stats, el('p', 'cf-desc', v['desc_' + lang]), pc, deprow, mini, foot);
      return c;
    }));
    ordered.forEach((v) => { const box = document.getElementById('car-' + v.id).querySelector('.cf-mini'); const pts = depBy.get(v.id); if (pts) drawMini(box, v, pts); });
  }

  dash.onData(render);
})();
</script>

</body>
</html>
